services:
  syndae-email:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndae-email-connector
    restart: unless-stopped
    ports:
      - "8771:8771"
    environment:
      - HTTP_PORT=8771
      - HTTP_HOST=0.0.0.0
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-gmail}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-}
      - IMAP_SECURE=${IMAP_SECURE:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - OAUTH2_CLIENT_ID=${OAUTH2_CLIENT_ID:-}
      - OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET:-}
      - OAUTH2_REFRESH_TOKEN=${OAUTH2_REFRESH_TOKEN:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - OUTLOOK_CLIENT_ID=${OUTLOOK_CLIENT_ID:-}
      - OUTLOOK_CLIENT_SECRET=${OUTLOOK_CLIENT_SECRET:-}
      - ENABLE_IDLE=${ENABLE_IDLE:-true}
      - SYNDAE_API_URL=http://host.docker.internal:3000
      - SYNDAE_ACCESS_KEY=${SYNDAE_ACCESS_KEY:-syndae-local-dev-key}
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
      - ./instructions.md:/app/instructions.md:ro
      - ./src:/app/src:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - syndae_default

networks:
  default:
  syndae_default:
    external: true
